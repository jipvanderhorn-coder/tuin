# Onderwerp

Wat is jouw interesse, waarom, wat, hoe (cultuur, vakmanschap, sport, idool, ​hobby, passie categorie enz.) toon een hoeveelheid afbeeldingen.​

mijn website gaat over hoe de "retro" stijl als een grote trend terug aan het komen is binnen interieur, posters, kleur en typografie. je zag afgelopen jaren dat binnen het interieur vooral beige en hout helemaal in was, terwijl filmposters juist helemaal over de top en drukker leken te worden ( je wist niet meer waar je kijken moest) en de logo's zo minimaal mogelijk werden gemaakt. nu wordt er op al deze vlakken weer steeds meer gebruik gemaakt van de "retro" ontwerpen, ik ben benieuwd hoe dit komt en wik dit graag onderzoeken en zo goed mogelijk visueel weergeven door middel van een website.
